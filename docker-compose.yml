services:
  theo:
    build:
      context: .
      args:
        THEO_INSTALL_ML: ${THEO_INSTALL_ML:-false}
    container_name: theo
    ports: ["8000:8000"]
    environment:
      THEO_DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://theo:${POSTGRES_PASSWORD:-theo_local_only}@postgres:5432/theo
      THEO_REDIS_URL: redis://redis:6379/0
      THEO_USE_CELERY: "true"
      THEO_AUTH_REQUIRED: "true"
      THEO_JWT_SECRET: ${THEO_JWT_SECRET:?Set THEO_JWT_SECRET in .env}
      MAX_UPLOAD_MB: 100
    volumes: ["theo_data:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: .
      args:
        THEO_INSTALL_ML: ${THEO_INSTALL_ML:-false}
    container_name: theo-worker
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "-l", "INFO"]
    environment:
      THEO_DATA_DIR: /app/data
      DATABASE_URL: postgresql+psycopg://theo:${POSTGRES_PASSWORD:-theo_local_only}@postgres:5432/theo
      THEO_REDIS_URL: redis://redis:6379/0
      THEO_JWT_SECRET: ${THEO_JWT_SECRET:?Set THEO_JWT_SECRET in .env}
    volumes: ["theo_data:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      theo: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: theo
      POSTGRES_USER: theo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-theo_local_only}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theo -d theo"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  theo_data:
  postgres_data:
